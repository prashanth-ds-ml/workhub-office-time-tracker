services:
  - type: web
    name: workhub-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd web_app && npm ci && npm run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: WORKHUB_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: workhub
      - key: WORKHUB_JWT_SECRET
        generateValue: true
      - key: WORKHUB_JWT_EXPIRE_HOURS
        value: "12"
      - key: WORKHUB_BOOTSTRAP_SECRET
        sync: false
      - key: WORKHUB_ALLOW_SELF_REGISTRATION
        value: "true"
      - key: WORKHUB_EMAIL_DOMAIN
        value: sims.healthcare
