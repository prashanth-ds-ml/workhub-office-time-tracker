services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-workhub}
    volumes:
      - workhub_postgres:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      WORKHUB_ENV: production
      POSTGRES_URL: postgresql://${POSTGRES_USER:-workhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workhub}
      WORKHUB_JWT_SECRET: ${WORKHUB_JWT_SECRET}
      WORKHUB_JWT_EXPIRE_HOURS: ${WORKHUB_JWT_EXPIRE_HOURS:-12}
      WORKHUB_BOOTSTRAP_SECRET: ${WORKHUB_BOOTSTRAP_SECRET}
      WORKHUB_ALLOW_SELF_REGISTRATION: ${WORKHUB_ALLOW_SELF_REGISTRATION:-false}
    ports:
      - "8000:8000"

volumes:
  workhub_postgres:
